[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghresearcher"
version = "0.1.0"
description = "A GitHub Code & Repo Analysis CLI for Researchers"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "textual>=0.40.0"
]

[project.scripts]
ghresearcher = "ghresearcher.cli:app"
