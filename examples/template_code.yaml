item_type: code
query: "TODO"

# ── Result Controls ───────────────────────────────────────────────
limit: 30
# sort is NOT supported for code search (will be ignored by GitHub)

# ── Output / formatting ───────────────────────────────────────────
# web: true                  # Open search in browser
# json: ["url", "path", "repository", "sha"]
# jq: ".[] | .path"
# template: "{{.path}}"

# ── Filter qualifiers ─────────────────────────────────────────────
language: python
owner: MaybeBio
repo: MaybeBio/GhResearcher
extension: py
filename: "main.py"
match: file                  # file | path
size: "1..50"