# ── gh search commits ──────────────────────────────────────────────
# Full parameter reference:  gh search commits --help
# GitHub docs: https://docs.github.com/search-github/searching-on-github/searching-commits
# ──────────────────────────────────────────────────────────────────

item_type: commits
query: "Initial commit"

# ── Result Controls ───────────────────────────────────────────────
limit: 30
sort: author-date            # author-date | committer-date
order: desc                  # asc | desc

# ── Output / formatting ───────────────────────────────────────────
# web: true                  # Open search in browser
# json: ["id", "commit", "author", "url"]
# jq: ".[] | .commit.message"
# template: "{{.commit.message}}"

# ── Boolean flags ─────────────────────────────────────────────────
merge: false

# ── Filter qualifiers ─────────────────────────────────────────────
author: "MaybeBio"
author_date: ">=2023-01-01"
author_email: "test@example.com"
author_name: "John Doe"
committer: "MaybeBio"
committer_date: ">=2023-01-01"
committer_email: "test@example.com"
committer_name: "John Doe"
hash: "8dd03144ffdc6c0d486d6b705f9c7fba871ee7c3"
owner: MaybeBio
parent: "parent_hash"
repo: MaybeBio/GhResearcher
tree: "tree_hash"
visibility: "public"         # public | private | internal