# ── gh search issues ───────────────────────────────────────────────
# Full parameter reference:  gh search issues --help
# GitHub docs: https://docs.github.com/search-github/searching-on-github/searching-issues-and-pull-requests
# ──────────────────────────────────────────────────────────────────

item_type: issues
query: "crash label:bug is:open"

# ── Result Controls ───────────────────────────────────────────────
limit: 30
sort: comments               # comments | created | interactions | reactions | reactions-+1 | reactions--1 | reactions-heart | reactions-smile | reactions-tada | reactions-thinking_face | updated
order: desc                  # asc | desc

# ── Output / formatting ───────────────────────────────────────────
# web: true                  # Open search in browser
# json: ["id", "title", "state", "url"]
# jq: ".[] | .title"
# template: "{{.title}}"

# ── Boolean flags ─────────────────────────────────────────────────
archived: false              # true | false
include_prs: false
locked: false
no_assignee: false
no_label: false
no_milestone: false
no_project: false

# ── Filter qualifiers ─────────────────────────────────────────────
app: "some-app"
assignee: "MaybeBio"
author: "MaybeBio"
closed: ">=2023-01-01"
commenter: "MaybeBio"
comments: ">=5"
created: ">=2023-01-01"
interactions: ">=10"
involves: "MaybeBio"
label: "bug"
language: python
match: title                 # title | body | comments
mentions: "MaybeBio"
milestone: "v1.0"
owner: MaybeBio
project: "MaybeBio/1"
reactions: ">=5"
repo: MaybeBio/GhResearcher
state: "open"                # open | closed
team_mentions: "my-team"
updated: ">=2023-01-01"
visibility: "public"         # public | private | internal